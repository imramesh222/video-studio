<script>
// Rainbow Rescue Bus, episode 7 (Touch Your Nose), in 3D. render(t) draws the exact frame at t seconds.
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeIn = (x) => Math.pow(clamp(x), 3);
const backOut = (x) => { x = clamp(x); const c1 = 2.2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const COLORS = { red: '#e53935', yellow: '#f2b705', green: '#43a047', blue: '#1e88e5' };
function rng(seed) {
  return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

THREE.ColorManagement.legacyMode = false;
let T, VIS, renderer, scene, cam, R = {}, SC = {};

const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0, ...o });
function mesh(geo, material, parent, pos = [0, 0, 0], scale) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(...pos);
  if (scale) m.scale.set(...scale);
  m.castShadow = true;
  m.receiveShadow = true;
  if (parent) parent.add(m);
  return m;
}
const sphere = (r, seg = 32) => new THREE.SphereGeometry(r, seg, Math.round(seg * 0.75));
const group = (parent, pos = [0, 0, 0]) => { const g = new THREE.Group(); g.position.set(...pos); if (parent) parent.add(g); return g; };
function roundedShape(w, h, r, cx = 0, cy = 0, path = new THREE.Shape()) {
  path.moveTo(cx - w / 2 + r, cy - h / 2);
  path.lineTo(cx + w / 2 - r, cy - h / 2); path.quadraticCurveTo(cx + w / 2, cy - h / 2, cx + w / 2, cy - h / 2 + r);
  path.lineTo(cx + w / 2, cy + h / 2 - r); path.quadraticCurveTo(cx + w / 2, cy + h / 2, cx + w / 2 - r, cy + h / 2);
  path.lineTo(cx - w / 2 + r, cy + h / 2); path.quadraticCurveTo(cx - w / 2, cy + h / 2, cx - w / 2, cy + h / 2 - r);
  path.lineTo(cx - w / 2, cy - h / 2 + r); path.quadraticCurveTo(cx - w / 2, cy - h / 2, cx - w / 2 + r, cy - h / 2);
  return path;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  tex.anisotropy = 8;
  return tex;
}
const decalMat = () => new THREE.MeshBasicMaterial({ transparent: true, polygonOffset: true, polygonOffsetFactor: -4 });

// ---------- mouths: the nine shapes (A-H, X) ----------
function mouthTextures(style) {
  const out = {};
  const dark = { bus: '#4a1424', frog: '#3d1a24' }[style] || '#5a1828';
  const line = { bus: '#26324a', kitty: '#7a3a4a', frog: '#1f4a1a' }[style] || '#1d1d1d';
  const wide = style === 'frog' ? 1.35 : 1;
  for (const s of 'ABCDEFGHX') {
    out[s] = canvasTex(256, 192, (g, w, h) => {
      g.lineCap = 'round'; g.lineJoin = 'round';
      const cx = w / 2, cy = h / 2;
      const open = (rx, ry, teeth = false, tng = true, up = false) => {
        rx *= wide;
        g.fillStyle = dark;
        g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); g.fill();
        g.save(); g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); g.clip();
        if (tng) { g.fillStyle = '#ff7d8f'; g.beginPath(); g.ellipse(cx, up ? cy - ry * 0.2 : cy + ry * 0.75, rx * 0.65, ry * 0.55, 0, 0, Math.PI * 2); g.fill(); }
        if (teeth) { g.fillStyle = '#fff'; g.fillRect(cx - rx, cy - ry, rx * 2, ry * 0.42); }
        g.restore();
        g.strokeStyle = line; g.lineWidth = 7;
        g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); g.stroke();
      };
      if (s === 'X') { g.strokeStyle = line; g.lineWidth = 11; g.beginPath(); g.moveTo(cx - 58 * wide, cy - 12); g.quadraticCurveTo(cx, cy + 38, cx + 58 * wide, cy - 12); g.stroke(); }
      if (s === 'A') { g.strokeStyle = line; g.lineWidth = 12; g.beginPath(); g.moveTo(cx - 46 * wide, cy); g.quadraticCurveTo(cx, cy + 12, cx + 46 * wide, cy); g.stroke(); }
      if (s === 'B') open(54, 22, true, false);
      if (s === 'C') open(52, 38, true);
      if (s === 'D') open(62, 58, true);
      if (s === 'E') open(40, 46);
      if (s === 'F') open(24, 26, false, false);
      if (s === 'G') { open(50, 22, true, false); }
      if (s === 'H') open(48, 40, true, true, true);
    });
  }
  return out;
}
const OPEN = { X: 0, A: 0, B: 0.25, C: 0.55, D: 0.85, E: 0.6, F: 0.35, G: 0.25, H: 0.5 };
function mouthAt(who, t) {
  for (const [k, l] of Object.entries(T.lines)) {
    if (l.who !== who) continue;
    const f = Math.floor((t - l.start) * T.fps);
    const s = VIS[k];
    if (f >= 0 && f < s.length) return s[f];
  }
  return 'X';
}

// ---------- characters ----------
// Every character: g (feet on the ground) > inner (bob and hop) > parts.
function eye(parent, pos, r, iris, opts = {}) {
  const e = group(parent, pos);
  mesh(sphere(r), mat('#ffffff', { roughness: 0.3 }), e);
  mesh(sphere(r * 0.74), mat(iris, { roughness: 0.25 }), e, [0, -r * 0.05, r * 0.45]);
  mesh(sphere(r * 0.4), mat('#140a05', { roughness: 0.2 }), e, [0, -r * 0.05, r * 0.88]);
  mesh(sphere(r * 0.22), mat('#ffffff', { emissive: '#ffffff', emissiveIntensity: 0.8 }), e, [-r * 0.25, r * 0.3, r * 1.08]);
  if (opts.scale) { e.scale.set(...opts.scale); e.userData.sy = opts.scale[1]; }
  return e;
}
function makePip() {
  const g = group(), inner = group(g), body = group(inner, [0, 1.85, 0]);
  const white = mat('#ffffff', { roughness: 0.75 }), black = mat('#1f1f22', { roughness: 0.7 });
  const head = group(body);
  mesh(sphere(0.55, 48), white, head);
  for (const sx of [-1, 1]) {
    mesh(sphere(0.2), black, head, [sx * 0.4, 0.42, -0.02]);
    mesh(sphere(0.1), mat('#3a3a3e'), head, [sx * 0.4, 0.43, 0.12]);
    const patch = mesh(sphere(0.2), black, head, [sx * 0.2, 0.03, 0.46], [0.9, 1.2, 0.45]);
    patch.rotation.z = sx * 0.5;
  }
  const eyes = [-1, 1].map((sx) => eye(head, [sx * 0.2, 0.04, 0.53], 0.1, '#6b3e26'));
  mesh(sphere(0.07), black, head, [0, -0.13, 0.53], [1.35, 0.9, 0.8]);
  for (const sx of [-1, 1]) mesh(sphere(0.085), mat('#ff9db0', { transparent: true, opacity: 0.55 }), head, [sx * 0.33, -0.16, 0.42], [1, 0.75, 0.4]);
  const mouth = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.225), decalMat());
  mouth.position.set(0, -0.29, 0.5); mouth.rotation.x = -0.25; head.add(mouth);
  const shirt = mat('#e8413b', { roughness: 0.8 });
  mesh(sphere(0.45), shirt, body, [0, -0.78, 0], [1, 0.95, 0.85]);
  mesh(sphere(0.4), mat('#2f6fd6', { roughness: 0.8 }), body, [0, -1.12, 0], [1, 0.7, 0.85]);
  const belt = mesh(new THREE.BoxGeometry(0.12, 1.0, 0.04), mat('#37414f'), body, [0, -0.78, 0.39]);
  belt.rotation.z = 0.75;
  const arms = [-1, 1].map((sx) => {
    const a = group(body, [sx * 0.38, -0.55, 0.05]);
    mesh(new THREE.CapsuleGeometry(0.11, 0.36, 8, 16), black, a, [0, -0.28, 0]);
    return a;
  });
  const legs = [-1, 1].map((sx) => {
    const l = group(body, [sx * 0.2, -1.32, 0]);
    mesh(new THREE.CapsuleGeometry(0.13, 0.22, 8, 16), black, l, [0, -0.2, 0]);
    mesh(sphere(0.15), black, l, [0, -0.42, 0.06], [1, 0.6, 1.3]);
    return l;
  });
  return { who: 'pip', g, inner, body, head, eyes, mouth, mouthStyle: 'pip', belt, armL: arms[0], armR: arms[1], legL: legs[0], legR: legs[1], headY: 1.85 };
}
function makeKitty() {
  const g = group(), inner = group(g);
  const fur = mat('#fbfbfb', { roughness: 0.85 }), pink = mat('#ffb3c7', { roughness: 0.6 });
  mesh(sphere(0.42), fur, inner, [0, 0.5, 0], [1, 0.95, 0.9]);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) mesh(sphere(0.12), fur, inner, [sx * 0.2, 0.1, sz * 0.18 + 0.05], [1, 0.7, 1.2]);
  const tailCurve = new THREE.CatmullRomCurve3([V(0, 0.4, -0.35), V(0.15, 0.6, -0.6), V(0.05, 0.95, -0.7), V(-0.1, 1.1, -0.55)]);
  mesh(new THREE.TubeGeometry(tailCurve, 24, 0.07, 10), fur, inner);
  const head = group(inner, [0, 1.12, 0.05]);
  mesh(sphere(0.42, 40), fur, head, [0, 0, 0], [1.08, 0.95, 0.95]);
  for (const sx of [-1, 1]) {
    const ear = mesh(new THREE.ConeGeometry(0.15, 0.3, 16), fur, head, [sx * 0.26, 0.38, -0.02]);
    ear.rotation.z = -sx * 0.35;
    const earIn = mesh(new THREE.ConeGeometry(0.09, 0.2, 16), pink, head, [sx * 0.255, 0.36, 0.04]);
    earIn.rotation.z = -sx * 0.35;
  }
  const eyes = [-1, 1].map((sx) => eye(head, [sx * 0.17, 0.04, 0.33], 0.11, '#3d8bfd', { scale: [1, 1.15, 1] }));
  mesh(sphere(0.045), pink, head, [0, -0.08, 0.41], [1.3, 0.9, 0.8]);
  for (const sx of [-1, 1]) {
    mesh(sphere(0.07), mat('#ffb0c4', { transparent: true, opacity: 0.6 }), head, [sx * 0.27, -0.11, 0.3], [1, 0.75, 0.4]);
    for (const k of [-1, 0, 1]) {
      const w = mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.34, 6), mat('#9aa0a8'), head, [sx * 0.3, -0.1 + k * 0.035, 0.32]);
      w.rotation.z = Math.PI / 2 + sx * k * 0.12;
    }
  }
  const mouth = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.165), decalMat());
  mouth.position.set(0, -0.2, 0.385); mouth.rotation.x = -0.2; head.add(mouth);
  const bow = group(head, [0.22, 0.3, 0.12]);
  bow.rotation.z = -0.35;
  const bowM = mat('#ff5fa2', { roughness: 0.45 });
  mesh(sphere(0.11), bowM, bow, [-0.11, 0, 0], [1, 0.75, 0.45]);
  mesh(sphere(0.11), bowM, bow, [0.11, 0, 0], [1, 0.75, 0.45]);
  mesh(sphere(0.055), mat('#e0408a'), bow);
  return { who: 'kitty', g, inner, head, eyes, mouth, mouthStyle: 'kitty', headY: 1.12 };
}
function makeDucky() {
  const g = group(), inner = group(g);
  const yellow = mat('#ffd93b', { roughness: 0.7 }), orange = mat('#ff9f1c', { roughness: 0.45 });
  mesh(sphere(0.5, 40), yellow, inner, [0, 0.5, 0], [1, 0.85, 1.05]);
  mesh(sphere(0.18), yellow, inner, [0, 0.62, -0.5], [1, 0.6, 1]).rotation.x = 0.6;
  for (const sx of [-1, 1]) mesh(sphere(0.16), orange, inner, [sx * 0.18, 0.04, 0.12], [1.1, 0.35, 1.5]);
  const wings = [-1, 1].map((sx) => {
    const w = group(inner, [sx * 0.46, 0.6, -0.02]);
    mesh(sphere(0.22), yellow, w, [sx * 0.05, -0.08, 0], [0.45, 1, 0.9]);
    return w;
  });
  const head = group(inner, [0, 1.08, 0.06]);
  mesh(sphere(0.36, 40), yellow, head);
  for (const k of [-1, 0, 1]) mesh(sphere(0.07), yellow, head, [k * 0.06, 0.36 + (k ? 0 : 0.03), -0.02 + Math.abs(k) * 0.02]);
  const eyes = [-1, 1].map((sx) => eye(head, [sx * 0.14, 0.08, 0.28], 0.075, '#1c1c1c'));
  for (const sx of [-1, 1]) mesh(sphere(0.06), mat('#ffa0a0', { transparent: true, opacity: 0.55 }), head, [sx * 0.22, -0.06, 0.25], [1, 0.75, 0.4]);
  mesh(sphere(0.16), orange, head, [0, -0.05, 0.33], [1.15, 0.38, 0.95]);
  const beakLow = group(head, [0, -0.1, 0.26]);
  mesh(sphere(0.13), orange, beakLow, [0, -0.02, 0.06], [1.05, 0.3, 0.9]);
  return { who: 'ducky', g, inner, head, eyes, beakLow, wings, headY: 1.08 };
}
function makeFroggy() {
  const g = group(), inner = group(g);
  const green = mat('#5cc94a', { roughness: 0.5 }), light = mat('#b6ec8a', { roughness: 0.6 });
  mesh(sphere(0.55, 40), green, inner, [0, 0.42, 0], [1.15, 0.72, 1]);
  mesh(sphere(0.4), light, inner, [0, 0.35, 0.22], [1, 0.7, 0.75]);
  for (const sx of [-1, 1]) {
    mesh(sphere(0.25), green, inner, [sx * 0.55, 0.2, -0.05], [0.8, 0.55, 1.3]);
    mesh(sphere(0.12), green, inner, [sx * 0.3, 0.07, 0.42], [1.2, 0.45, 1.2]);
  }
  const pack = group(inner, [0, 0.55, -0.48]);
  mesh(new THREE.ExtrudeGeometry(roundedShape(0.55, 0.5, 0.12), { depth: 0.18, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 4 }),
    mat('#ffcf33', { roughness: 0.5 }), pack, [0, 0, -0.2]);
  mesh(new THREE.BoxGeometry(0.4, 0.14, 0.04), mat('#f0a500'), pack, [0, -0.08, 0.02]);
  for (const sx of [-1, 1]) mesh(new THREE.TorusGeometry(0.3, 0.025, 8, 24, Math.PI), mat('#f0a500'), inner, [sx * 0.28, 0.55, -0.1]).rotation.y = Math.PI / 2;
  const head = group(inner, [0, 0.62, 0.05]);
  const eyes = [-1, 1].map((sx) => {
    mesh(sphere(0.22), green, head, [sx * 0.27, 0.22, 0.05]);
    return eye(head, [sx * 0.27, 0.27, 0.16], 0.16, '#1c1c1c');
  });
  for (const sx of [-1, 1]) mesh(sphere(0.07), mat('#ff9db0', { transparent: true, opacity: 0.55 }), head, [sx * 0.42, -0.08, 0.36], [1, 0.75, 0.4]);
  const mouth = new THREE.Mesh(new THREE.PlaneGeometry(0.42, 0.24), decalMat());
  mouth.position.set(0, -0.12, 0.47); mouth.rotation.x = -0.35; head.add(mouth);
  return { who: 'froggy', g, inner, head, eyes, mouth, mouthStyle: 'frog', headY: 0.62 };
}
function makeBirdie() {
  const g = group(), inner = group(g);
  const blue = mat('#6ec6ff', { roughness: 0.6 }), orange = mat('#ff9f1c', { roughness: 0.45 }), white = mat('#e8f6ff', { roughness: 0.7 });
  mesh(sphere(0.3, 32), blue, inner, [0, 0.36, 0], [1, 0.95, 1.05]);
  mesh(sphere(0.2), white, inner, [0, 0.32, 0.14], [1, 1, 0.8]);
  for (const k of [-1, 0, 1]) mesh(sphere(0.1), blue, inner, [k * 0.07, 0.36, -0.36], [0.5, 0.25, 1.2]).rotation.y = k * 0.3;
  for (const sx of [-1, 1]) mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.12, 6), orange, inner, [sx * 0.08, 0.06, 0.02]);
  const wings = [-1, 1].map((sx) => {
    const w = group(inner, [sx * 0.28, 0.42, 0]);
    mesh(sphere(0.15), blue, w, [sx * 0.04, -0.06, 0], [0.4, 1, 0.9]);
    return w;
  });
  const head = group(inner, [0, 0.72, 0.04]);
  mesh(sphere(0.23, 32), blue, head);
  mesh(sphere(0.05), blue, head, [0, 0.23, 0]);
  const eyes = [-1, 1].map((sx) => eye(head, [sx * 0.1, 0.05, 0.18], 0.055, '#1c1c1c'));
  for (const sx of [-1, 1]) mesh(sphere(0.04), mat('#ffa0b4', { transparent: true, opacity: 0.6 }), head, [sx * 0.14, -0.05, 0.17], [1, 0.75, 0.4]);
  const up = mesh(new THREE.ConeGeometry(0.06, 0.16, 16), orange, head, [0, -0.01, 0.27]);
  up.rotation.x = Math.PI / 2;
  const beakLow = group(head, [0, -0.04, 0.21]);
  const lo = mesh(new THREE.ConeGeometry(0.045, 0.12, 16), orange, beakLow, [0, -0.01, 0.05]);
  lo.rotation.x = Math.PI / 2;
  return { who: 'birdie', g, inner, head, eyes, beakLow, wings, headY: 0.72 };
}

// ---------- Sunny the bus, with real windows ----------
function makeBus() {
  const g = group(), bob = group(g);
  const yellow = mat('#ffc928', { roughness: 0.38 }), trim = mat('#f0a500', { roughness: 0.45 });
  const L = 7.6, H = 2.85, D = 2.5, bev = 0.25, base = 0.75;
  const winX = [-2.5, -0.85, 0.8], winY = 2.85;
  const shape = roundedShape(L, H, 0.6);
  for (const x of winX) shape.holes.push(roundedShape(1.25, 1.15, 0.22, x, winY - base - H / 2, new THREE.Path()));

    pos.setY(i, y);
    tmp.copy(a).lerp(b, 0.5 + 0.5 * Math.sin(x * 0.21 + z * 0.17) * Math.sin(z * 0.11));
    cols.push(tmp.r, tmp.g, tmp.b);

  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  geo.computeVertexNormals();

  });

// ---------- per-frame helpers ----------
const look = (c) => { cam.position.set(c[0], c[1], c[2]); cam.lookAt(c[3], c[4], c[5]); };
function camPath(u, keys) {
  if (u <= keys[0][0]) return keys[0].slice(1);
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (u <= b[0]) { const k = ease((u - a[0]) / Math.max(0.001, b[0] - a[0])); return a.slice(1).map((v, j) => lerp(v, b[j + 1], k)); }
  }
  return keys[keys.length - 1].slice(1);
}
function blink(t, period, offset) {
  const k = ((t + offset) % period) / 0.16;
  return k < 1 ? Math.sin(k * Math.PI) : 0;
}
// Scene-relative times of the n-th line (1-based; -1 = the last line) and of cues.
function ln(s, n) {
  if (n < 0) n = Math.max(...Object.keys(T.lines).filter((k) => k.startsWith(s.id + '_')).map((k) => +k.split('_')[1])) + 1 + n;
  const base = `${s.id}_${String(n).padStart(2, '0')}`;
  const l = T.lines[base] || Object.entries(T.lines).find(([k]) => k.startsWith(base + '_'))[1];
  return { a: l.start - s.start, b: l.start - s.start + l.dur };
}
const cu = (s, name) => s.cues[name] - s.start;
function hop(t, at, h = 0.5, d = 0.55) { const k = (t - at) / d; return k > 0 && k < 1 ? Math.sin(k * Math.PI) * h : 0; }

function ambient(t, cx = 0) {
  R.sun.position.set(cx + 34, 34, -95);
  R.clouds.forEach((c, i) => { c.g.position.x = cx + ((c.x + t * (0.5 + i * 0.12) + 90) % 180) - 90; });
  R.flies.forEach((f, i) => {
    const bx = cx + [-7, 6, -2, 9][i], bz = [-3.2, -4, -2.8, -3.6][i];
    f.g.position.set(bx + Math.sin(t * 0.6 + i * 2) * 3, 3.4 + i * 0.35 + Math.sin(t * 1.4 + i) * 0.5, bz + Math.cos(t * 0.5 + i) * 0.6);
    f.g.rotation.y = Math.sin(t * 0.6 + i * 2) * 0.8;
    f.g.visible = f.g.position.distanceTo(cam.position) > 7;
    const flap = Math.sin(t * 14 + i) * 0.9;
    f.wings[0].rotation.y = flap; f.wings[1].rotation.y = -flap;
  });
  for (const list of [R.valleyFlowers, R.meadowFlowers, R.pondFlowers]) list.forEach((f, i) => { f.head.rotation.z = Math.sin(t * 1.6 + i) * 0.12; });
  if (scene.background === R.skies.night) R.flies.forEach((f) => { f.g.visible = false; });
  R.sunLight.position.set(cx - 12, 22, 16);
  R.sunLight.target.position.set(cx, 0, 0);
}

function setBus(t, x, dist, moving, z = 0, rotY = 0) {
  const B = R.bus;
  B.g.visible = true;
  B.g.position.set(x, 0, z);
  B.g.rotation.y = rotY;
  B.bob.position.y = moving ? Math.abs(Math.sin(t * 9)) * 0.05 : Math.sin(t * 2.2) * 0.015;
  B.bob.rotation.z = moving ? Math.sin(t * 9) * 0.006 : 0;
  B.wheels.forEach((w) => { w.rotation.z = -dist / 0.66; });
  const lid = 1 - 0.95 * blink(t, 4.1, 2.0);
  B.eyes.forEach(({ e, iris }) => { e.scale.y = lid; iris.position.x = Math.sin(t * 0.8) * 0.05; iris.position.y = -0.03; });
  B.mouth.material.map = R.mouths.bus[mouthAt('sunny', t)];
  B.mouth.material.needsUpdate = true;
}

// Put a character on the ground at (x, z), or in a bus seat.
function place(c, x, z, o = {}) {
  scene.add(c.g);
  c.g.visible = true;
  c.g.position.set(x, o.y || 0, z);
  c.g.rotation.set(0, o.rotY || 0, 0);
  c.g.scale.setScalar(o.s || 1);
}
function seat(c, slot, o = {}) {
  R.bus.slots[slot].add(c.g);
  c.g.visible = true;
  c.g.position.set(o.dx || 0, o.dy || 0, o.dz || 0);
  c.g.rotation.set(0, o.rotY || 0, 0);
  c.g.scale.setScalar(o.s || 1);
}
// Blink, talk, breathe; o.hop (height), o.tilt, o.look (head turn), o.flap, o.dance.
function animate(c, t, o = {}) {
  const shape = mouthAt(c.who, t);
  const talking = shape !== 'X';
  c.eyes.forEach((e) => { e.scale.y = (e.userData.sy || 1) * (1 - 0.95 * blink(t, 3.4 + c.who.length * 0.3, c.who.length)); });
  if (c.mouth) { c.mouth.material.map = R.mouths[c.mouthStyle][shape]; c.mouth.material.needsUpdate = true; }
  if (c.beakLow) c.beakLow.rotation.x = OPEN[shape] * 0.55;
  const breathe = Math.sin(t * 2.4 + c.who.length) * 0.015;
  c.inner.position.y = (o.hop || 0) + (o.dance ? Math.abs(Math.sin(t * 5.9)) * 0.25 : 0);
  c.inner.scale.set(1 - breathe, 1 + breathe, 1 - breathe);
  c.inner.rotation.z = o.dance ? Math.sin(t * 2.95) * 0.18 : 0;
  c.head.rotation.z = (o.tilt || 0) + (talking ? Math.sin(t * 6) * 0.06 : Math.sin(t * 1.6 + c.who.length) * 0.03);
  c.head.rotation.x = (o.lookUp || 0) + (talking ? Math.sin(t * 4.3) * 0.04 : 0);
  c.head.rotation.y = o.look || 0;
  if (c.wings) {
    const f = o.flap ? Math.sin(t * 22) * 0.9 : Math.sin(t * 3 + c.who.length) * 0.08;
    c.wings[0].rotation.z = -Math.abs(f) - 0.05; c.wings[1].rotation.z = Math.abs(f) + 0.05;
  }
  if (c.who === 'pip') {
    c.belt.visible = !!o.belt;
    c.armR.rotation.set(o.armRx || 0, 0, o.armR ?? 0.15);
    c.armL.rotation.set(o.armLx || 0, 0, o.armL ?? -0.15);
    const swing = o.walk ? Math.sin(t * 8) * 0.5 : 0;
    c.legL.rotation.x = swing; c.legR.rotation.x = -swing;
    if (o.walk) { c.armL.rotation.x = -swing * 0.6; c.armR.rotation.x = swing * 0.6; c.inner.position.y += Math.abs(Math.sin(t * 8)) * 0.06; }
  }
}
// Pip's arms: wave (right), point (left, toward -x), clap, up (dance).
const WAVE = (t) => ({ armR: 2.6 + Math.sin(t * 9) * 0.35 });
const POINT = (t) => ({ armL: -(Math.PI / 2 + 0.45) + Math.sin(t * 3) * 0.08 });
const POINT_R = (t) => ({ armR: Math.PI / 2 + 0.45 + Math.sin(t * 3) * 0.08 });
const CLAP = (t) => { const k = Math.abs(Math.sin(t * 9)); return { armL: -1.0 - k * 0.35, armR: 1.0 + k * 0.35, armLx: -1.2, armRx: -1.2 }; };
const ARMS_UP = (t) => ({ armL: -2.5 + Math.sin(t * 5.9) * 0.3, armR: 2.5 - Math.sin(t * 5.9) * 0.3 });

function highlight(obj, ring, t, at, base = 1) {
  const k = t - at;
  const on = k > 0;
  obj.scale.setScalar(base * (on ? 1 + 0.25 * backOut(clamp(k / 0.5)) + 0.05 * Math.sin(k * 6) : 1));
  obj.rotation.y = on ? Math.sin(k * 2) * 0.4 : 0;
  if (ring) { ring.material.opacity = on ? Math.min(0.9, k * 2) * (0.6 + 0.4 * Math.sin(k * 8)) : 0; ring.scale.setScalar(1 + 0.08 * Math.sin(k * 6)); }
}

// ---------- overlays ----------
function word(text, color, a, b, t, o = {}) {

}

// ---------- episode 2: shapes, Lumi, evening and night ----------
const FRIENDS = ['kitty', 'ducky', 'froggy', 'birdie'];
const SHAPE = {
  circle: { word: 'CIRCLE', color: '#e53935' },
  square: { word: 'SQUARE', color: '#1e88e5' },
  triangle: { word: 'TRIANGLE', color: '#43a047' },
  star: { word: 'STAR', color: '#f2b705' },
};
const KINDS = ['circle', 'square', 'triangle', 'star'];

function shapePts(kind, r) {
  if (kind === 'square') return [[-r, -r], [r, -r], [r, r], [-r, r]];
  if (kind === 'triangle') return [[0, r * 1.15], [-r * 1.1, -r * 0.75], [r * 1.1, -r * 0.75]];
  if (kind === 'star') return [...Array(10)].map((_, i) => {
    const a = Math.PI / 2 + (i * Math.PI) / 5, rr = i % 2 ? r * 0.5 : r;
    return [Math.cos(a) * rr, Math.sin(a) * rr];
  });
  return null;
}
function shapeGeo(kind, r, depth = 0.24, bevel = 0.07) {
  const s = new THREE.Shape();
  if (kind === 'circle') s.absarc(0, 0, r, 0, Math.PI * 2, false);
  else shapePts(kind, r).forEach(([x, y], i) => (i ? s.lineTo(x, y) : s.moveTo(x, y)));
  const geo = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 5, curveSegments: 40 });
  geo.translate(0, 0, -depth / 2);
  return geo;
}
// A chunky shape toy standing up, facing the camera.
function shapeToy(parent, kind, r = 0.6, color) {

  s21: { worlds: ['meadow'], sky: 'night', draw(s, u, t) {   // touch them with me
    ambient(t, 0);
    setBus(t, 0, 0, false, -4.6);
    const fs = [1, 2, 3, 4, 5, 6].map((i) => cu(s, 'f' + i)), clapAt = cu(s, 'clap');

      animate(C()[who], t, { hop: hops, flap: who === 'birdie', ...(who === 'pip' ? (u > clapAt ? CLAP(t) : i >= 0 ? (BODY6[i] === 'hands' ? { armL: -2.6 + Math.sin(t * 9) * 0.3, armR: 2.6 + Math.sin(t * 9 + 1) * 0.3 } : TOUCH[BODY6[i]](t)) : WAVE(t)) : {}) });
    });
    if (i === 5 && u < clapAt) stompLegs(C().pip, u, [fs[5] + 0.1, fs[5] + 0.45]);
    lumiAt(t, -6.4, 2.4 + hops * 0.5, 3.0, { light: 1.2 });
    look(camPath(u, [[0, 0, 2.4, 12, 0, 2.2, 2], [fs[0] - 0.4, 0, 2.1, 9.8, 0, 1.6, 3.6], [s.dur, 0, 2.1, 9.8, 0, 1.6, 3.6]]));
    fs.forEach((f, k) => { ring('pip', BODY6[k], s.start + f, t, s.start + (k < 5 ? fs[k + 1] - 0.3 : clapAt)); word(BODY6[k], s.start + f, s.start + (k < 5 ? fs[k + 1] - 0.05 : s.dur), t); });
    sparkleAt(s.cues.clap, t);
  } },
  s22: { worlds: ['recap'], draw(s, u, t) {   // that is my body
    const rs = [1, 2, 3, 4, 5, 6].map((i) => cu(s, 'r' + i)), body = cu(s, 'body');
    let i = 0; rs.forEach((r, k) => { if (u >= r - 0.3) i = k; });
    const all = u > body - 0.2;
    R.backdrop.material.color.set(all ? '#ffd43b' : PART[BODY6[i]].color).lerp(WHITE, 0.8);
    place(C().pip, 0, 0, { s: 1.9, y: -0.9 });
    animate(C().pip, t, all ? { ...ARMS_UP(t), hop: hop(u, body, 0.3, 0.45) } : BODY6[i] === 'hands' ? { armL: -1.4, armR: 1.4 } : TOUCH[BODY6[i]](t));
    if (!all && BODY6[i] === 'feet') stompLegs(C().pip, u, [rs[5] + 0.1, rs[5] + 0.5]);
    look([0, 1.9, 9.4, 0, 1.75, 0]);
    rs.forEach((r, k) => ring('pip', BODY6[k], s.start + r, t, s.start + (k < 5 ? rs[k + 1] - 0.3 : body - 0.2)));
    if (all) BODY6.forEach((p) => ring('pip', p, s.start + body, t));
    rs.forEach((r, k) => word(BODY6[k], s.start + r, s.start + (k < 5 ? rs[k + 1] : body) - 0.05, t));

  } },
  s23: { worlds: ['road'], sky: 'night', draw(s, u, t) {
    const dist = u * 7;
    R.scroll.position.x = -(dist % 50.6); R.scrollTrees.position.x = -((dist * 0.9) % 52.8);
    ambient(t, 0);
    setBus(t, 0, dist, true);
    seatAll(t, { wave: u < ln(s, 1).b + 0.6 });

    look(camPath(u, [[0, -0.8, 3.0, 10.5, -0.8, 2.6, 0], [ln(s, 1).b, 0.2, 3.0, 10.5, -0.2, 2.6, 0], [ln(s, 2).a + 0.3, 11.5, 2.7, 5.5, 2.8, 2.3, 0.2], [s.dur, 12.5, 2.7, 5.0, 2.9, 2.3, 0.2]]));
  } },
  s24: { worlds: ['meadow'], sky: 'night', draw(s, u, t) {
    ambient(t, 0);
    setBus(t, 4.6, 0, false, -1.6, -0.35);
    const spots = [['pip', -0.6, 4.2], ['kitty', -2.6, 3.8], ['ducky', 1.4, 4.0], ['froggy', -4.3, 3.4], ['birdie', 3.1, 3.6]];
    const bye = cu(s, 'rainbow'), cl = cu(s, 'close');

      place(C()[who], x, z, { rotY: -x * 0.05, y: who === 'birdie' ? 0.9 + Math.sin(t * 3) * 0.12 : 0 });
      animate(C()[who], t, { hop: u > bye ? Math.abs(Math.sin(t * 4 + i)) * 0.2 : 0, flap: who === 'birdie' || (who === 'ducky' && u > bye), ...(who === 'pip' && u > ln(s, 2).a ? WAVE(t) : {}) });
      if (u > cl && u < ln(s, 2).a) C()[who].eyes.forEach((e) => { e.scale.y *= 0.08; });   // everyone closes their eyes
    });
    lumiAt(t, -0.2, 3.7, 3.2, { glow: 0.3 + (u > bye ? 0.4 : 0), light: 1.8 });

};
const P7 = () => R.p7;

function render(t) {
  ['wordWrap', 'numWrap', 'end', 'pairWrap'].forEach((id) => { document.getElementById(id).style.display = 'none'; });
  document.querySelectorAll('.dot').forEach((d) => { d.style.visibility = 'hidden'; });
  R.sparks.forEach((s) => { s.el.style.display = 'none'; });
  R.flies.forEach((f) => { f.g.visible = false; });
  R.wordShown = false;
  Object.values(R.W).forEach((w) => { w.visible = false; });
  Object.values(R.c).forEach((c) => { c.g.visible = false; });
  R.balloons.forEach((b) => { b.visible = false; });
  R.fallLeaves.forEach((l) => { l.visible = false; });
  R.birdTree.visible = false; R.friendTree.visible = false; R.skyRainbow.visible = false;
  R.pondGame.visible = false; R.forestGame.visible = false; R.meadowGame.visible = false; R.froggyLeaf.visible = false;
  R.W.garden.visible = false; R.W.rby.visible = false;
  const P = R.p;
  [P.float, P.duckBall, P.game5, P.present, P.sq, P.tri, P.game9, P.melon, P.game14, P.game18, P.house, P.pine, P.pineLine.g, ...P.blocks, ...P.carry, ...P.big, ...P.recap]
    .forEach((o) => { o.visible = false; });
  R.firstStar.visible = false;
  R.sunRing.material.opacity = 0;
  R.bus.hubs.forEach((h) => { h.material.emissiveIntensity = 0; });
  R.bus.g.visible = false;
  R.bus.g.scale.setScalar(1);
  R.hide3.forEach((o) => { o.visible = false; });
  R.hide4.forEach((o) => { o.visible = false; });
  R.hide5.forEach((o) => { o.visible = false; });
  R.hide6.forEach((o) => { o.visible = false; });
  R.hide7.forEach((o) => { o.visible = false; });
  R.rings.forEach((el) => { el.style.display = 'none'; }); R.ringI = 0;
  C().pip.mouth.scale.setScalar(1);
  R.sun.scale.set(26, 26, 1); scene.fog.color.set('#cbeeff');
  R.ringN = 0; R.bus.g.rotation.z = 0;
  R.forestPad.visible = true;
  R.bushes.forEach((b) => { b.visible = true; });
  R.sun.material.color.set('#ffffff');
  document.getElementById('hands').style.display = 'none';
  R.tags.forEach((el) => { el.style.display = 'none'; });
  R.tagN = 0; R.mw = false;
  setSky('day');

  const title = document.getElementById('title');
  title.style.display = t < T.title ? 'flex' : 'none';
  if (t < T.title) {
    [...title.children].forEach((d, i) => { d.style.transform = `translateY(${Math.sin(t * 3 + i) * 6}px) scale(${backOut(seg(t, 0.5 + i * 0.35, 1.2 + i * 0.35))})`; });
    R.W.valley.visible = true;
    R.skyRainbow.visible = true;
    R.skyRainbow.position.set(0, 0, -6);
    R.skyRainbow.scale.setScalar(Math.max(0.001, backOut(seg(t, 0.1, 1.0))));
    ambient(t, 0);
    look([0, 3.2 + t * 0.15, 17, 0, 4.2, -6]);
  } else {
    const s = T.scenes.find((x) => t >= x.start && t < x.start + x.dur) || T.scenes[T.scenes.length - 1];
    const def = SCENES[s.id];
    def.worlds.forEach((w) => { R.W[w].visible = true; });
    if (def.sky) setSky(def.sky);
    if (s.id === 's22') { scene.background = new THREE.Color('#ffffff'); scene.fog.far = 1000; R.sun.visible = false; R.starField.visible = false; }
    def.draw(s, t - s.start, t);
  }
  let flash = 0;
  for (const s of T.scenes) flash = Math.max(flash, 1 - Math.abs(t - s.start) / 0.3);
  document.getElementById('flash').style.opacity = clamp(flash) * 0.85;
  renderer.render(scene, cam);
}
